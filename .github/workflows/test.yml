name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # npm 11 預設不執行套件安裝腳本；updater 測試會 require('electron')，需要 Electron 本體
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npx --no-install vite build
